<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Pedidos de mesero · 01 Pasos guiados</title>
<style>
:root{
  --brand:#b91c1c;--brand-strong:#991b1b;--brand-soft:#fef2f2;--on-brand:#fff;
  --canvas:#f8fafc;--surface:#fff;--surface-sunken:#f1f5f9;--border:#e2e8f0;--border-strong:#cbd5e1;
  --text:#0f172a;--text-muted:#475569;--text-subtle:#64748b;
  --success:#047857;--success-soft:#ecfdf5;--warning:#92400e;--warning-soft:#fffbeb;
  --danger:#be123c;--danger-soft:#fff1f2;--focus:#0369a1;
  --r1:8px;--r2:12px;--r3:16px;
}
*{box-sizing:border-box;margin:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:#e5e7eb;width:1440px;height:960px;overflow:hidden;padding:14px 24px 0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{display:flex;align-items:baseline;gap:20px;height:42px}
.top h1{font-size:22px}
.top p{font-size:14px;color:var(--text-muted)}
.row{display:flex;gap:40px;justify-content:center;margin-top:4px}
figure{width:390px}
figcaption{height:26px;font-size:14px;font-weight:700;color:var(--text-muted);display:flex;align-items:center}
.phone{width:390px;height:844px;border-radius:32px;background:var(--canvas);border:1px solid var(--border-strong);box-shadow:0 8px 24px rgba(15,23,42,.14);overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:24px;padding:6px 22px 0;font-size:12px;font-weight:600;display:flex;justify-content:space-between;background:var(--surface)}
.steps{display:flex;gap:6px;padding:8px 12px 10px;background:var(--surface);border-bottom:1px solid var(--border);list-style:none}
.steps li{flex:1;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text-muted);min-height:32px;padding:0 8px;border-radius:999px;background:var(--surface-sunken)}
.steps b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--border-strong);color:var(--text)}
.steps li.done b{background:var(--success);color:#fff}
.steps li.on{background:var(--brand);color:var(--on-brand)}
.steps li.on b{background:#fff;color:var(--brand)}
.body{flex:1;overflow-y:auto;padding:12px 14px}
h2{font-size:17px;margin-bottom:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--surface-sunken);border-radius:var(--r2)}
.seg button{min-height:52px;border:0;border-radius:var(--r1);background:transparent;font-size:16px;font-weight:700;color:var(--text-muted)}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--on-brand)}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tile{min-height:76px;border-radius:var(--r2);border:2px solid var(--border-strong);background:var(--surface);padding:6px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tile strong{font-size:18px}
.tile small{font-size:12px;line-height:1.25;color:var(--text-muted)}
.tile.libre{border-color:#6ee7b7;background:var(--success-soft)}
.tile.libre em{font-style:normal;font-size:12px;font-weight:700;color:var(--success)}
.tile.ocup{background:var(--warning-soft);border-color:#fcd34d}
.tile.ocup em{font-style:normal;font-size:12px;font-weight:700;color:var(--warning)}
.tile[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.panel{margin-top:10px;padding:10px 12px;border-radius:var(--r2);background:var(--surface);border:1px solid var(--border);font-size:14px}
.panel .btn{margin-top:8px}
.btn{width:100%;min-height:48px;border-radius:var(--r2);border:2px solid var(--brand);background:var(--surface);color:var(--brand);font-weight:700;font-size:15px}
.btn.pri{background:var(--brand);color:var(--on-brand);min-height:52px;font-size:16px}
.btn.pri:hover{background:var(--brand-strong)}
.btn[aria-disabled=true]{background:var(--border);border-color:var(--border);color:var(--text-muted);cursor:not-allowed}
label.f{display:block;margin-top:12px;font-size:14px;font-weight:700}
label.f span{font-weight:400;color:var(--text-muted)}
input[type=text],input[type=search],input[type=time]{width:100%;min-height:48px;margin-top:4px;padding:0 12px;border:2px solid var(--border-strong);border-radius:var(--r1);background:var(--surface)}
.foot{padding:10px 14px;background:var(--surface);border-top:1px solid var(--border)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-top:1px solid var(--border);height:60px}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-muted);text-decoration:none;gap:2px}
.tabs a[aria-current=page]{color:var(--brand)}
.tabs svg{width:22px;height:22px}
/* screen 2 */
.ctx{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--brand-soft);border-bottom:1px solid #fecaca}
.ctx p{flex:1;font-size:14px;font-weight:700;color:var(--brand-strong)}
.ctx button{min-height:44px;padding:0 14px;border:2px solid var(--brand);background:var(--surface);color:var(--brand);border-radius:var(--r1);font-weight:700}
.pills{display:flex;gap:6px;overflow:hidden;margin:10px 0}
.pills button{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--border-strong);background:var(--surface);font-weight:600;white-space:nowrap;font-size:14px}
.pills button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
h3{font-size:13px;color:var(--text-muted);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.quick{display:flex;gap:6px}
.quick button{flex:1;min-height:48px;border-radius:var(--r1);border:1px solid var(--border-strong);background:var(--surface);font-size:13px;font-weight:600;padding:2px 4px}
.armar{width:100%;min-height:68px;border-radius:var(--r2);border:0;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;gap:12px;padding:0 14px;text-align:left;margin-top:8px}
.armar svg{width:34px;height:34px;flex:none}
.armar strong{display:block;font-size:17px}
.armar span{font-size:13px}
.armar .bd{margin-left:auto;background:#fff;color:var(--brand);border-radius:999px;padding:2px 10px;font-weight:800;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prod{position:relative;min-height:72px;border-radius:var(--r2);border:2px solid var(--border-strong);background:var(--surface);padding:8px 10px;text-align:left;font-weight:700;font-size:14px;line-height:1.25;display:flex;flex-direction:column;justify-content:center}
.prod.has{border-color:var(--brand);background:var(--brand-soft)}
.prod.off{background:var(--surface-sunken);color:var(--text-muted);border-style:dashed;cursor:not-allowed}
.prod .tag{font-size:12px;font-weight:700;color:var(--danger);margin-top:2px}
.badge{position:absolute;top:-8px;right:-4px;background:var(--brand);color:#fff;border-radius:999px;min-width:34px;height:26px;display:grid;place-items:center;font-size:14px;font-weight:800;border:2px solid #fff}
.pcard{grid-column:1/-1;border-radius:var(--r2);border:2px solid var(--border-strong);background:var(--surface);padding:8px 10px;position:relative}
.pcard.has{border-color:var(--brand);background:var(--brand-soft)}
.pcard>strong{font-size:14px}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chips span.l{font-size:13px;font-weight:600;color:var(--text-muted);align-self:center}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.bar{display:flex;align-items:center;gap:10px;min-height:56px;width:100%;border:0;border-radius:var(--r2);background:var(--brand);color:var(--on-brand);padding:0 16px;font-size:16px;font-weight:700;justify-content:space-between}
/* screen 3 */
.sum{padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);font-size:14px;display:flex;justify-content:space-between;align-items:center}
.sum b{color:var(--brand-strong)}
.sum button{min-height:44px;border:0;background:none;color:var(--brand);font-weight:700;text-decoration:underline}
.line{margin-top:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2)}
.line.bad{border:2px solid #fcd34d;background:var(--warning-soft)}
.line .t{font-size:14px;font-weight:700;line-height:1.3}
.line .t small{display:block;font-weight:400;color:var(--text-muted);font-size:13px}
.ctl{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty{display:flex;align-items:center;gap:4px;background:var(--surface-sunken);border-radius:var(--r1);padding:2px}
.qty button{width:48px;min-height:48px;border:0;border-radius:var(--r1);background:var(--surface);font-size:24px;font-weight:700;color:var(--brand);border:1px solid var(--border-strong)}
.qty output{min-width:36px;text-align:center;font-size:20px;font-weight:800}
.link{min-height:44px;border:0;background:none;padding:0 8px;font-size:14px;font-weight:700;color:var(--brand);text-decoration:underline}
.link.q{margin-left:auto;color:var(--danger)}
.ok{margin-top:10px;padding:10px 12px;border-radius:var(--r2);background:var(--surface-sunken);font-size:14px;list-style:none}
.ok li{padding:3px 0;display:flex;gap:8px}
.ok .y{color:var(--success)}
.ok .n{color:var(--warning);font-weight:700}
.snack{position:absolute;left:12px;right:12px;bottom:140px;background:var(--text);color:#fff;border-radius:var(--r2);padding:0 6px 0 14px;min-height:48px;display:flex;align-items:center;justify-content:space-between;font-size:14px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.snack button{border:0;background:none;color:#fecaca;font-weight:800;padding:0 12px;text-decoration:underline}
.snack[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>01 · Pasos guiados</h1>
  <p><b>Compromiso:</b> el más fácil de aprender (siempre sabes en qué paso vas), pero una mesa con pedido repetido cuesta 3 pantallas en lugar de 1.</p>
</header>

<main class="row">

<!-- ============ PANTALLA 1 ============ -->
<figure>
<figcaption>Paso 1 · Mesa</figcaption>
<section class="phone" aria-label="Pantalla 1: Mesa">
  <div class="status"><span>9:41</span><span>Lucía</span></div>
  <ol class="steps" aria-label="Pasos del pedido">
    <li class="on" aria-current="step"><b>1</b>Mesa</li><li><b>2</b>Productos</li><li><b>3</b>Revisar</li>
  </ol>
  <div class="body">
    <h2>¿Dónde es el pedido?</h2>
    <div class="seg" role="group" aria-label="Tipo de pedido" id="tipo">
      <button type="button" aria-pressed="true" data-t="Aquí">Aquí</button>
      <button type="button" aria-pressed="false" data-t="Para llevar">Para llevar</button>
    </div>

    <h2 style="margin-top:14px">Elige la mesa</h2>
    <div class="map" id="map" role="group" aria-label="Mapa de mesas">
      <button type="button" class="tile libre" aria-pressed="false" data-m="M-1"><strong>M-1</strong><em>Libre</em></button>
      <button type="button" class="tile ocup" aria-pressed="false" data-m="M-2" data-o="Ficha 7 · 25 min · Jorge"><strong>M-2</strong><em>Ocupada</em><small>Ficha 7 · 25 min · Jorge</small></button>
      <button type="button" class="tile libre" aria-pressed="false" data-m="M-3"><strong>M-3</strong><em>Libre</em></button>
      <button type="button" class="tile libre" aria-pressed="true" data-m="M-4"><strong>M-4</strong><em>Libre</em></button>
      <button type="button" class="tile libre" aria-pressed="false" data-m="M-5"><strong>M-5</strong><em>Libre</em></button>
      <button type="button" class="tile ocup" aria-pressed="false" data-m="M-6" data-o="Ficha 12 · 8 min · Lucía"><strong>M-6</strong><em>Ocupada</em><small>Ficha 12 · 8 min · Lucía</small></button>
      <button type="button" class="tile libre" aria-pressed="false" data-m="M-7"><strong>M-7</strong><em>Libre</em></button>
      <button type="button" class="tile libre" aria-pressed="false" data-m="M-8"><strong>M-8</strong><em>Libre</em></button>
      <button type="button" class="tile libre" aria-pressed="false" data-m="M-9"><strong>M-9</strong><em>Libre</em></button>
    </div>
    <div class="panel" id="panel" aria-live="polite"><b>M-4</b> está libre. Se abrirá un pedido nuevo.</div>

    <label class="f" for="nombre">Nombre del cliente <span id="req">(opcional en mesa · obligatorio para llevar)</span></label>
    <input type="text" id="nombre" value="Familia Ortega" autocomplete="off">
  </div>
  <div class="foot"><button class="btn pri" type="button">Siguiente: productos →</button></div>
  <nav class="tabs" aria-label="Navegación principal">
    <a href="#" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Pedidos</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></svg>Entrega</a>
  </nav>
</section>
</figure>

<!-- ============ PANTALLA 2 ============ -->
<figure>
<figcaption>Paso 2 · Productos</figcaption>
<section class="phone" aria-label="Pantalla 2: Productos">
  <div class="status"><span>9:42</span><span>Lucía</span></div>
  <ol class="steps" aria-label="Pasos del pedido">
    <li class="done"><b>✓</b>Mesa</li><li class="on" aria-current="step"><b>2</b>Productos</li><li><b>3</b>Revisar</li>
  </ol>
  <div class="ctx"><p>M-4 · Aquí · Familia Ortega</p><button type="button">Cambiar</button></div>
  <div class="body">
    <label class="sr" for="busca">Buscar producto</label>
    <input type="search" id="busca" placeholder="Buscar producto…" style="margin-top:0">
    <div class="pills" role="group" aria-label="Categorías">
      <button type="button" aria-pressed="false">Pizzas</button>
      <button type="button" aria-pressed="true">Hamburguesas</button>
      <button type="button" aria-pressed="false">Botanas</button>
      <button type="button" aria-pressed="false">Bebidas</button>
      <button type="button" aria-pressed="false">Extras</button>
    </div>
    <h3>Más pedidos</h3>
    <div class="quick">
      <button type="button">Papas gajo</button><button type="button">Coca-Cola</button><button type="button">Naranjada</button>
    </div>

    <button type="button" class="armar">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#fff"/><path d="M16 16V2M16 16l12 7M16 16L4 23" stroke="#b91c1c" stroke-width="2"/><circle cx="10" cy="10" r="2.5" fill="#b91c1c"/><circle cx="22" cy="11" r="2.5" fill="#b91c1c"/><circle cx="16" cy="24" r="2.5" fill="#b91c1c"/></svg>
      <span><strong>Armar pizza</strong><span>Tamaño, mitades y extras</span></span><span class="bd">×1</span>
    </button>

    <h3>Hamburguesas</h3>
    <div class="grid" id="prods">
      <div class="pcard has">
        <span class="badge" id="b-ran">×2</span>
        <strong>Hamburguesa El Ranchito</strong>
        <div class="chips" role="group" aria-label="Elige: Res o Pollo">
          <span class="l">Elige:</span>
          <button type="button" class="chip" aria-pressed="true">Res</button>
          <button type="button" class="chip" aria-pressed="false">Pollo</button>
        </div>
      </div>
      <button type="button" class="prod">Hamburguesa Monster sencilla</button>
      <button type="button" class="prod">Hamburguesa Monster doble carne</button>
      <div class="pcard">
        <strong>Alitas 5 pzas</strong>
        <div class="chips" role="group" aria-label="Elige sabor">
          <span class="l">Elige:</span>
          <button type="button" class="chip" aria-pressed="false">Búfalo</button>
          <button type="button" class="chip" aria-pressed="false">BBQ</button>
          <button type="button" class="chip" aria-pressed="false">Mango-Habanero</button>
        </div>
      </div>
      <button type="button" class="prod off" disabled aria-label="Aros de cebolla 10 pzas, agotado">Aros de cebolla 10 pzas<span class="tag">Agotado</span></button>
      <button type="button" class="prod">Nuggets de pollo 10 pzas</button>
    </div>
  </div>
  <div class="foot"><button class="bar" type="button"><span>3 productos</span><span>Revisar pedido →</span></button></div>
  <nav class="tabs" aria-label="Navegación principal">
    <a href="#" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Pedidos</a>
    <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></svg>Entrega</a>
  </nav>
</section>
</figure>

<!-- ============ PANTALLA 3 ============ -->
<figure>
<figcaption>Paso 3 · Revisar</figcaption>
<section class="phone" aria-label="Pantalla 3: Revisar">
  <div class="status"><span>9:44</span><span>Lucía</span></div>
  <ol class="steps" aria-label="Pasos del pedido">
    <li class="done"><b>✓</b>Mesa</li><li class="done"><b>✓</b>Productos</li><li class="on" aria-current="step"><b>3</b>Revisar</li>
  </ol>
  <div class="body">
    <div class="sum"><span><b>M-4 · Aquí</b> · Familia Ortega</span><button type="button">Cambiar</button></div>

    <div class="line" data-line>
      <div class="t">Pizza Grande<small>Mitad Pepperoni / Mitad Hawaiana · Extra queso</small></div>
      <div class="ctl">
        <div class="qty" role="group" aria-label="Cantidad de Pizza Grande"><button type="button" data-d="-1" aria-label="Quitar uno">−</button><output>1</output><button type="button" data-d="1" aria-label="Agregar uno">+</button></div>
        <button type="button" class="link">Agregar nota</button>
        <button type="button" class="link q" data-rm="Pizza Grande">Quitar</button>
      </div>
    </div>

    <div class="line" data-line>
      <div class="t">Hamburguesa El Ranchito · Res<small>Nota: sin cebolla</small></div>
      <div class="ctl">
        <div class="qty" role="group" aria-label="Cantidad de Hamburguesa El Ranchito Res"><button type="button" data-d="-1" aria-label="Quitar uno">−</button><output>1</output><button type="button" data-d="1" aria-label="Agregar uno">+</button></div>
        <button type="button" class="link">Editar nota</button>
        <button type="button" class="link q" data-rm="Hamburguesa El Ranchito">Quitar</button>
      </div>
    </div>

    <div class="line bad" data-line id="pend">
      <div class="t">Hamburguesa El Ranchito<small>Falta elegir:</small></div>
      <div class="chips" role="group" aria-label="Elige: Res o Pollo">
        <button type="button" class="chip" aria-pressed="false" data-pick>Res</button>
        <button type="button" class="chip" aria-pressed="false" data-pick>Pollo</button>
      </div>
      <div class="ctl">
        <div class="qty" role="group" aria-label="Cantidad de Hamburguesa El Ranchito"><button type="button" data-d="-1" aria-label="Quitar uno">−</button><output>1</output><button type="button" data-d="1" aria-label="Agregar uno">+</button></div>
        <button type="button" class="link">Agregar nota</button>
        <button type="button" class="link q" data-rm="Hamburguesa El Ranchito">Quitar</button>
      </div>
    </div>

    <label class="f" for="nota">Nota del pedido <span>(opcional)</span></label>
    <input type="text" id="nota" placeholder="Ej. Todo junto, sin prisa">
    <label class="f" for="hora">Hora para recoger <span>(opcional)</span></label>
    <input type="time" id="hora">

    <ul class="ok" id="check" aria-live="polite" aria-label="Lista de verificación">
      <li><span class="y" aria-hidden="true">✓</span>Mesa y tipo de pedido</li>
      <li><span class="y" aria-hidden="true">✓</span>Productos agregados</li>
      <li id="m-var"><span class="n" aria-hidden="true">!</span><span class="n">Falta: elegir Res o Pollo en Hamburguesa El Ranchito</span></li>
    </ul>
  </div>

  <div class="snack" id="snack" role="status" hidden><span id="snackt">Quitaste Papas gajo</span><button type="button" id="undo">Deshacer</button></div>

  <div class="foot">
    <button class="btn pri" type="button" id="send" aria-disabled="true">Enviar a cocina</button>
  </div>
  <nav class="tabs" aria-label="Navegación principal">
    <a href="#" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Pedidos</a>

</main>

<script>
(function(){
  var tipo="Aquí", mesa="M-4";
  var nombre=document.getElementById('nombre'), req=document.getElementById('req');
  var panel=document.getElementById('panel');

  function updatePanel(btn){
    var o=btn.dataset.o;
    if(o){
      panel.innerHTML='<b>'+btn.dataset.m+'</b> ocupada · '+o+'<button type="button" class="btn">Agregar a este pedido</button>';
    } else {
      panel.innerHTML='<b>'+btn.dataset.m+'</b> está libre. Se abrirá un pedido nuevo.';
    }
  }
  document.getElementById('map').addEventListener('click',function(e){
    var b=e.target.closest('.tile'); if(!b) return;
    document.querySelectorAll('.tile').forEach(function(t){t.setAttribute('aria-pressed',t===b)});
    mesa=b.dataset.m; updatePanel(b);
  });
  document.getElementById('tipo').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    this.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
    tipo=b.dataset.t;
    req.textContent = tipo==='Para llevar' ? '(obligatorio para llevar)' : '(opcional en mesa · obligatorio para llevar)';
    syncMissing();
  });
  nombre.addEventListener('input',syncMissing);

  /* single-select chips / pills */
  document.querySelectorAll('.chips,.pills').forEach(function(g){
    g.addEventListener('click',function(e){
      var b=e.target.closest('button'); if(!b) return;
      g.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
      if(b.hasAttribute('data-pick')) syncMissing();
    });
  });

  /* quantity */
  document.querySelectorAll('.qty').forEach(function(q){
    q.addEventListener('click',function(e){
      var b=e.target.closest('button'); if(!b) return;
      var o=q.querySelector('output'), n=Math.max(1,+o.textContent+ +b.dataset.d);
      o.textContent=n;
    });
  });

  /* remove + undo */
  var snack=document.getElementById('snack'), st=document.getElementById('snackt'), last=null, timer;
  document.querySelectorAll('[data-rm]').forEach(function(b){
    b.addEventListener('click',function(){
      var line=b.closest('[data-line]');
      last={el:line,next:line.nextSibling,parent:line.parentNode};
      line.remove(); st.textContent='Quitaste '+b.dataset.rm;
      snack.hidden=false; clearTimeout(timer); timer=setTimeout(function(){snack.hidden=true},6000);
      syncMissing();
    });
  });
  document.getElementById('undo').addEventListener('click',function(){
    if(last){last.parent.insertBefore(last.el,last.next); last=null;}
    snack.hidden=true; syncMissing();
  });

  /* checklist */
  var check=document.getElementById('check'), send=document.getElementById('send');
  function syncMissing(){
    check.querySelectorAll('[data-dyn]').forEach(function(n){n.remove()});
    var pend=document.getElementById('pend');
    var varOpen = pend && pend.isConnected && !pend.querySelector('[aria-pressed=true]');
    document.getElementById('m-var').hidden=!varOpen;
    var n=varOpen?1:0;
    if(tipo==='Para llevar' && !nombre.value.trim()){
      var li=document.createElement('li'); li.setAttribute('data-dyn','');
      li.innerHTML='<span class="n" aria-hidden="true">!</span><span class="n">Falta: nombre del cliente</span>';
      check.appendChild(li); n++;
    }
    if(pend) pend.classList.toggle('bad',varOpen);
    send.setAttribute('aria-disabled',n>0);
  }
  send.addEventListener('click',function(e){ if(send.getAttribute('aria-disabled')==='true') e.preventDefault(); });
  syncMissing();
})();
</script>
</body>
</html>
